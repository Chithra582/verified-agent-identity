name: "did-identity-creator"
description: "Mints a new Ethereum-compatible iden3 decentralized identity (DID) and stores it in the local vault."
input_schema:
  type: object
  properties:
    network:
      type: string
      enum:
        - "billions-mainnet"
        - "billions-testnet"
        - "sepolia"
      description: "Target blockchain network for identity registration."
      default: "billions-testnet"
    force_new:
      type: boolean
      description: "Whether to overwrite existing identity if present."
      default: false
  required: []
